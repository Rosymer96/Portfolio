<div class="project-container">
  <a
    class="project"
    [href]="project()?.link"
    (click)="projectVisit()"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span
      class="title"
      >{{ project()?.title }}
    </span>
    <img [src]="project()?.img" alt="{{ project()?.title }}" class="img" />
  </a>
  <p class="description">{{ project()?.description }}</p>
  <div class="tecnologies">
    @for (tecnologie of project()?.technologies; track $index) {
      <p>{{ tecnologie }}</p>
    }
  </div>
  <a
    (click)="githubProjectVisit()"
    [href]="project()?.githubLink"
    class="icon-github"
    target="_blank"
    rel="noopener noreferrer"
    ><i class="fa-brands fa-github icon"></i
  ></a>
</div>
